<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Girl 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Container Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      transition: all 0.5s ease;
    }

    h1 {
      color: #ff4757;
      font-size: 1.8rem;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 20px rgba(255, 71, 87, 0.6);
    }

    .btn-no {
      background: #e0e0e0;
      color: #666;
    }

    .btn-no:hover {
      transform: scale(0.95);
    }

    /* Floating particles canvas */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    /* Final Card Styling */
    .final-card h2 {
      color: #ff4757;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .final-card p {
      color: #444;
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .signature {
      margin-top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff4757;
      letter-spacing: 1px;
    }

    /* Hidden YouTube player container */
    #audio-container {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="card" id="quizCard">
    <h1 id="questionText">My baby loves strawberries ? 🍓</h1>
    <div class="btn-group">
      <button class="btn-yes" onclick="handleYes()">YES! 💕</button>
      <button class="btn-no" onclick="handleNo()">No 🥺</button>
    </div>
  </div>

  <!-- Hidden YouTube Audio Player -->
  <div id="audio-container">
    <iframe id="youtube-player" width="0" height="0" src="https://www.youtube.com/embed/gset79KMmt0?enablejsapi=1&autoplay=0" frameborder="0" allow="autoplay"></iframe>
  </div>

  <script>
    const questions = [
      { text: "My baby loves strawberries ? 🍓", emoji: "🍓", type: "strawberries" },
      { text: "My baby loves firecrackers ? 🎆", emoji: "🎆", type: "firecrackers" },
      { text: "My baby loves friesss? 🍟", emoji: "🍟", type: "fries" },
      { text: "My baby loves christmas ? 🎄✨", emoji: "❄️", type: "christmas" }
    ];

    let currentStep = 0;
    const questionText = document.getElementById("questionText");
    const quizCard = document.getElementById("quizCard");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Canvas Resize
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Particle System
    let particles = [];

    class Particle {
      constructor(x, y, emoji) {
        this.x = x;
        this.y = y;
        this.emoji = emoji;
        this.size = Math.random() * 25 + 25; 
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.7) * 14;
        this.gravity = 0.35;
        this.opacity = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.vRot;
        this.opacity -= 0.008;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.emoji, -this.size / 2, this.size / 2);
        ctx.restore();
      }
    }

    function createExplosion(emoji, count = 70) {
      const originX = window.innerWidth / 2;
      const originY = window.innerHeight / 2;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(originX, originY, emoji));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Play YouTube Music on 2nd Question YES
    function playYouTubeSong() {
      const iframe = document.getElementById("youtube-player");
      // Re-triggering the iframe source with autoplay=1 enabled
      iframe.src = "https://www.youtube.com/embed/gset79KMmt0?autoplay=1&enablejsapi=1";
    }

    // Handles YES clicks
    function handleYes() {
      const q = questions[currentStep];

      // Trigger Explosion based on item type
      if (q.type === "strawberries") {
        createExplosion("🍓");
      } else if (q.type === "firecrackers") {
        createExplosion("🎆");
        createExplosion("✨");
        // Play the exact YouTube song on the 2nd question YES!
        playYouTubeSong();
      } else if (q.type === "fries") {
        createExplosion("🍟");
      } else if (q.type === "christmas") {
        createExplosion("🎄");
        createExplosion("❄️");
        createExplosion("🎁");
      }

      currentStep++;

      // Next Question or Final Screen
      if (currentStep < questions.length) {
        setTimeout(() => {
          questionText.innerText = questions[currentStep].text;
        }, 300);
      } else {
        setTimeout(showFinalMessage, 500);
      }
    }

    // Handles NO click playful behavior
    function handleNo() {
      const btnNo = document.querySelector('.btn-no');
      btnNo.style.position = 'relative';
      btnNo.style.left = (Math.random() * 100 - 50) + 'px';
      btnNo.style.top = (Math.random() * 100 - 50) + 'px';
    }

    // Final Screen Message
    function showFinalMessage() {
      quizCard.className = "card final-card";
      quizCard.innerHTML = `
        <h2>Merry Christmas & Always! 🎄✨</h2>
        <p>Thanks to my baby for getting born in this world. Or else I would've never gotten to witness a Christmas miracle as beautiful as you.</p>
        <p>You mahh gurllll is the sweet spicy cute hot magic I never knew I needed and the sweetest gift life could have ever given me :)</p>
        <div class="signature">YOUR HANDSOME BF ;)</div>
      `;
    }
  </script>
</body>
</html>
