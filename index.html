<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Girl 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Container Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      transition: all 0.5s ease;
    }

    h1 {
      color: #ff4757;
      font-size: 1.8rem;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 20px rgba(255, 71, 87, 0.6);
    }

    .btn-no {
      background: #e0e0e0;
      color: #666;
    }

    .btn-no:hover {
      transform: scale(0.95);
    }

    /* Floating particles canvas */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    /* Final Card Styling */
    .final-card h2 {
      color: #ff4757;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .final-card p {
      color: #444;
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .signature {
      margin-top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff4757;
      letter-spacing: 1px;
    }

    /* Hidden YouTube player container */
    #audio-container {
      display: none;
    }
  </style>
</head>

    </div>
