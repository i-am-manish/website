<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2 because V1 did not work</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #050b14;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Polar Lights (Aurora) Background Effect */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #050b14 0%, #0a1f2c 50%, #022b21 100%);
            overflow: hidden;
        }

        .aurora-glow {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.15) 0%, rgba(0, 150, 255, 0.1) 30%, transparent 70%);
            animation: auroraAnimation 15s ease infinite alternate;
        }

        @keyframes auroraAnimation {
            0% { transform: translate(-10%, -10%) rotate(0deg); }
            100% { transform: translate(10%, 10%) rotate(180deg); }
        }

        /* Snowfall Effect */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
            z-index: -1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0);
            }
            100% {
                transform: translateY(105vh) translateX(20px);
            }
        }

        /* Main Card Container */
        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1.site-title {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            color: #00ff9d;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.4);
        }

        .message-box {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .message-image {
            max-width: 140px;
            max-height: 140px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(0, 255, 157, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .message-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #e0f2fe;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, #00ff9d 0%, #00b8ff 100%);
            color: #050b14;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 157, 0.5);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            box-shadow: none;
        }

        .step-counter {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="aurora-glow"></div>
    </div>

    <div class="container">
        <h1 class="site-title">V2 because V1 did not work</h1>
        
        <div class="message-box" id="messageBox">
            <!-- Dynamic content injected via JS -->
        </div>

        <div class="nav-buttons">
            <button id="prevBtn" onclick="prevStep()" disabled>Previous</button>
            <span class="step-counter" id="stepCounter">1 / 8</span>
            <button id="nextBtn" onclick="nextStep()">Next</button>
        </div>
    </div>

    <script>
        // Assigned images for each step
        const steps = [
            {
                text: "Life without you literally sucks. I'm nothing without you. Brain does not brain, no hunger, no sleep, nothing. <br>Feels someone took something out from me",
                image: "https://i.pinimg.com/236x/84/df/9e/84df9ea8fc79d5df1f0535eb105d39c9.jpg"
            },
            {
                text: "I deserve a life in hell.<br>But before making it to hell, please let me experience heaven on earth by being with ya.",
                image: "https://i.pinimg.com/736x/25/17/5f/25175f4199d590ef6b93c56d4c210ed8.jpg"
            },
            {
                text: "No matter how crazy it gets, just your face and voice makes everything feel right no cap.",
                image: "https://images.pexels.com/photos/30321467/pexels-photo-30321467/free-photo-of-two-cats-cuddling-in-warm-sunlight.jpeg?auto=compress&w=1260&h=750&dpr=1"
            },
            {
                text: "You are my that one supporter in every scene.<br>Be it dad, be it interview na clear hona, be it my wo unknown disease where i was not able to walk, be it content flop jaana, be it shirt pe kuch girke embarrass hona.... in all such scenarios.",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREG4mtCNNkBTD07edwnzWIgGDV043lc92BnGx5-9jkTw&s=10"
            },
            {
                text: "When you love a person so so so much, putting all efforts 110% and when that douche says hurtful mean things, it can literally destroy every feeling you have towards him.",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6lxt-Anvr8UnyOFSe84jLjQyOGbKBmp2v0DiW6uYumdDqYdq7Izxn2E8&s=10"
            },
            {
                text: "You are literally a perfect gem that everyone dreams to have in their life.<br>But some fucker craps like me fail to notice it. Very Bad. Bad person.",
                image: "https://i.redd.it/wrk11ahyn3jf1.jpeg"
            },
            {
                text: "If anyone should learn how to love a person, they should come to you. I bet you won't find a single soul on earth that has a capacity to love so much.",
                image: "https://i.pinimg.com/474x/ea/ef/da/eaefdaec97b53c6510083d543e0fcfa7.jpg"
            },
            {
                text: "Lastly, I'm here to stay and make the difference that I can make till my last dying breathe.<br>I'm sure my Dad will beat my ass up if he's watching all of my shitfucks from up there.<br><br>Anyways, until my final breath, my only goal is to be the guy you deserve and love you endlessly.",
                image: "https://i.redd.it/vamy6d7ajfr81.jpg"
            }
        ];

        let currentStep = 0;

        function updateContent() {
            const messageBox = document.getElementById('messageBox');
            const stepCounter = document.getElementById('stepCounter');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            const current = steps[currentStep];

            let htmlContent = "";
            if (current.image) {
                htmlContent += `<img src="${current.image}" alt="Memory Image" class="message-image">`;
            }
            htmlContent += `<div class="message-text">${current.text}</div>`;

            messageBox.innerHTML = htmlContent;
            stepCounter.innerText = `${currentStep + 1} / ${steps.length}`;

            prevBtn.disabled = currentStep === 0;
            nextBtn.innerText = currentStep === steps.length - 1 ? "End ❤️" : "Next";
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateContent();
            } else {
                alert("Thank you for reading everything. I love you!");
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateContent();
            }
        }

        // Generate Falling Snowflakes
        function createSnowflakes() {
            const snowCount = 50;
            for (let i = 0; i < snowCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.style.left = `${Math.random() * 100}vw`;
                snowflake.style.top = `${Math.random() * -100}vh`;
                const size = Math.random() * 4 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                snowflake.style.animationDuration = `${Math.random() * 5 + 3}s`;
                snowflake.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(snowflake);
            }
        }

        window.onload = () => {
            updateContent();
            createSnowflakes();
        };
    </script>
</body>
</html>
