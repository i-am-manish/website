<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Girl 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Snowflakes Container */
    #snow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      top: -20px;
      color: white;
      font-size: 1rem;
      opacity: 0.8;
      user-select: none;
      animation: fallSnow linear infinite;
    }

    @keyframes fallSnow {
      0% {
        transform: translateY(-20px) rotate(0deg);
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    /* Container Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      transition: all 0.4s ease;
    }

    h1 {
      color: #ff4757;
      font-size: 1.7rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* Custom Image for Christmas Question */
    .question-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      display: none; /* Shown dynamically */
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
      min-height: 80px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, font-size 0.2s, padding 0.2s;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-yes:hover {
      box-shadow: 0 12px 20px rgba(255, 71, 87, 0.6);
      transform: scale(1.05);
    }

    /* Lightweight floating emoji shower styling */
    .floating-emoji {
      position: fixed;
      pointer-events: none;
      z-index: 8;
      font-size: 2rem;
      user-select: none;
      animation: fallAndBurst 1.2s ease-out forwards;
    }

    @keyframes fallAndBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--randX), var(--randY)) scale(1.4) rotate(360deg);
      }
    }

    /* Final Card Styling */
    .final-card h2 {
      color: #ff4757;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .final-card p {
      color: #444;
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .signature {
      margin-top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff4757;
      letter-spacing: 1px;
    }

    #audio-container {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Persistent Background Snowfall -->
  <div id="snow-container"></div>

  <div class="card" id="quizCard">
    <img id="questionImg" class="question-img" src="" alt="Christmas Special" />
    <h1 id="questionText">My baby loves strawberries ? 🍓</h1>
    <div class="btn-group">
      <button class="btn-yes" id="yesBtn" onclick="handleYes()">YES! 💕</button>
    </div>
  </div>

  <!-- Hidden YouTube Audio Player (starts at 10 seconds) -->
  <div id="audio-container">
    <iframe id="youtube-player" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>
  </div>

  <script>
    // Continuous Background Snow Effect
    const snowContainer = document.getElementById("snow-container");
    function createSnowflake() {
      const flake = document.createElement("div");
      flake.className = "snowflake";
      flake.innerText = Math.random() > 0.5 ? "❄️" : "❅";
      flake.style.left = Math.random() * window.innerWidth + "px";
      flake.style.fontSize = (Math.random() * 10 + 10) + "px";
      const duration = Math.random() * 3 + 4; // 4 to 7 seconds fall time
      flake.style.animationDuration = duration + "s";
      snowContainer.appendChild(flake);

      setTimeout(() => {
        flake.remove();
      }, duration * 1000);
    }
    setInterval(createSnowflake, 300);

    const questions = [
      { text: "My baby loves strawberries ? 🍓", emojis: ["🍓"], img: "" },
      { text: "My baby loves firecrackers ? 🎆", emojis: ["🎆", "✨", "🔥"], img: "" },
      { text: "My baby loves friesss? 🍟", emojis: ["🍟"], img: "" },
      { text: "My baby loves christmas ? 🎄✨", emojis: ["🎄", "❄️", "🎁", "⭐"], img: "https://paintwaint.in/cdn/shop/files/Background_9_ed1353e7-9041-4650-a810-714686588d38.png?v=1764053643&width=720" }
    ];

    let currentStep = 0;
    let yesClickCount = 0;
    const questionText = document.getElementById("questionText");
    const questionImg = document.getElementById("questionImg");
    const quizCard = document.getElementById("quizCard");
    const yesBtn = document.getElementById("yesBtn");

    // Lightweight DOM-based explosion & shower
    function createLightShow(emojiArray) {
      const totalEmojis = 25; 
      for (let i = 0; i < totalEmojis; i++) {
        const span = document.createElement('div');
        span.className = 'floating-emoji';
        span.innerText = emojiArray[Math.floor(Math.random() * emojiArray.length)];

        const startX = window.innerWidth / 2;
        const startY = window.innerHeight / 2;
        span.style.left = startX + 'px';
        span.style.top = startY + 'px';

        const randX = (Math.random() - 0.5) * window.innerWidth * 0.9;
        const randY = (Math.random() - 0.6) * window.innerHeight * 0.8;
        span.style.setProperty('--randX', `${randX}px`);
        span.style.setProperty('--randY', `${randY}px`);

        document.body.appendChild(span);

        setTimeout(() => {
          span.remove();
        }, 1200);
      }
    }

    // Play YouTube Music starting precisely at 10 seconds
    function playYouTubeSong() {
      const iframe = document.getElementById("youtube-player");
      iframe.src = "https://www.youtube.com/embed/gset79KMmt0?autoplay=1&enablejsapi=1&start=10";
    }

    // Handles YES clicks
    function handleYes() {
      const q = questions[currentStep];
      yesClickCount++;

      // Make the YES button grow larger smoothly
      const currentPaddingV = 14 + (yesClickCount * 8);
      const currentPaddingH = 32 + (yesClickCount * 14);
      const currentFontSize = 1.2 + (yesClickCount * 0.25);
      yesBtn.style.padding = `${currentPaddingV}px ${currentPaddingH}px`;
      yesBtn.style.fontSize = `${currentFontSize}rem`;

      // Play song starting at 10s on the 2nd question (firecrackers)
      if (currentStep === 1) {
        playYouTubeSong();
      }

      // Trigger lag-free explosion & shower
      createLightShow(q.emojis);

      currentStep++;

      // Next Question or Final Screen
      if (currentStep < questions.length) {
        setTimeout(() => {
          questionText.innerText = questions[currentStep].text;
          
          // Handle specific question image
          if (questions[currentStep].img) {
            questionImg.src = questions[currentStep].img;
            questionImg.style.display = "block";
          } else {
            questionImg.style.display = "none";
          }
        }, 250);
      } else {
        setTimeout(showFinalMessage, 500);
      }
    }

    // Final Screen Message
    function showFinalMessage() {
      questionImg.style.display = "none";
      quizCard.className = "card final-card";
      quizCard.innerHTML = `
        <h2>Merry Christmas & Always! 🎄✨</h2>
        <p>Thanks to my baby for getting born in this world. Or else I would've never gotten to witness a Christmas miracle as beautiful as you.</p>
        <p>You mahh gurllll is the sweet spicy cute hot magic I never knew I needed and the sweetest gift life could have ever given me :)</p>
        <div class="signature">YOUR HANDSOME BF ;)</div>
      `;
    }
  </script>
</body>
</html>
