<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Girl 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Container Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      transition: all 0.5s ease;
    }

    h1 {
      color: #ff4757;
      font-size: 1.8rem;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      min-height: 80px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, font-size 0.2s, padding 0.2s;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-yes:hover {
      box-shadow: 0 12px 20px rgba(255, 71, 87, 0.6);
      transform: scale(1.05);
    }

    /* Floating particles canvas */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    /* Final Card Styling */
    .final-card h2 {
      color: #ff4757;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .final-card p {
      color: #444;
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .signature {
      margin-top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff4757;
      letter-spacing: 1px;
    }

    /* Hidden YouTube player container */
    #audio-container {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="card" id="quizCard">
    <h1 id="questionText">My baby loves strawberries ? 🍓</h1>
    <div class="btn-group">
      <button class="btn-yes" id="yesBtn" onclick="handleYes()">YES! 💕</button>
    </div>
  </div>

  <!-- Hidden YouTube Audio Player (starts at exactly 10 seconds) -->
  <div id="audio-container">
    <iframe id="youtube-player" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>
  </div>

  <script>
    const questions = [
      { text: "My baby loves strawberries ? 🍓", emojis: ["🍓"] },
      { text: "My baby loves firecrackers ? 🎆", emojis: ["🎆", "✨", "🔥"] },
      { text: "My baby loves friesss? 🍟", emojis: ["🍟"] },
      { text: "My baby loves christmas ? 🎄✨", emojis: ["🎄", "❄️", "🎁", "⭐"] }
    ];

    let currentStep = 0;
    let yesClickCount = 0;
    const questionText = document.getElementById("questionText");
    const quizCard = document.getElementById("quizCard");
    const yesBtn = document.getElementById("yesBtn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Canvas Resize
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Particle System (Optimized for performance)
    let particles = [];

    class Particle {
      constructor(x, y, emoji, isShower = false) {
        this.x = x;
        this.y = y;
        this.emoji = emoji;
        this.size = Math.random() * 22 + 18; 
        
        if (isShower) {
          // Shower behavior: falls from top across the full width
          this.vx = (Math.random() - 0.5) * 2;
          this.vy = Math.random() * 3 + 2;
          this.gravity = 0.05;
        } else {
          // Explosion behavior: bursts out from center
          this.vx = (Math.random() - 0.5) * 14;
          this.vy = (Math.random() - 0.6) * 16;
          this.gravity = 0.3;
        }

        this.opacity = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.15;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.vRot;
        this.opacity -= 0.004; // Smooth fade out
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.emoji, -this.size / 2, this.size / 2);
        ctx.restore();
      }
    }

    function createExplosionAndShower(emojiArray) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // 1. Center Explosion burst
      for (let i = 0; i < 40; i++) {
        const randomEmoji = emojiArray[Math.floor(Math.random() * emojiArray.length)];
        particles.push(new Particle(centerX, centerY, randomEmoji, false));
      }

      // 2. Full-page Shower (falling all over the screen)
      for (let i = 0; i < 40; i++) {
        const randomEmoji = emojiArray[Math.floor(Math.random() * emojiArray.length)];
        const randomX = Math.random() * window.innerWidth;
        const randomY = Math.random() * (window.innerHeight / 2); // starts from upper half
        particles.push(new Particle(randomX, randomY, randomEmoji, true));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0 || particles[i].y > window.innerHeight) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Play YouTube Music starting precisely at 10 seconds
    function playYouTubeSong() {
      const iframe = document.getElementById("youtube-player");
      iframe.src = "https://www.youtube.com/embed/gset79KMmt0?autoplay=1&enablejsapi=1&start=10";
    }

    // Handles YES clicks
    function handleYes() {
      const q = questions[currentStep];
      yesClickCount++;

      // Make the YES button grow larger on each click
      const currentPaddingV = 14 + (yesClickCount * 10);
      const currentPaddingH = 32 + (yesClickCount * 18);
      const currentFontSize = 1.2 + (yesClickCount * 0.3);
      yesBtn.style.padding = `${currentPaddingV}px ${currentPaddingH}px`;
      yesBtn.style.fontSize = `${currentFontSize}rem`;

      // Play song starting at 10s on the 2nd question (firecrackers)
      if (currentStep === 1) {
        playYouTubeSong();
      }

      // Trigger lag-free explosion + shower across the whole page
      createExplosionAndShower(q.emojis);

      currentStep++;

      // Next Question or Final Screen
      if (currentStep < questions.length) {
        setTimeout(() => {
          questionText.innerText = questions[currentStep].text;
        }, 300);
      } else {
        setTimeout(showFinalMessage, 600);
      }
    }

    // Final Screen Message
    function showFinalMessage() {
      quizCard.className = "card final-card";
      quizCard.innerHTML = `
        <h2>Merry Christmas & Always! 🎄✨</h2>
        <p>Thanks to my baby for getting born in this world. Or else I would've never gotten to witness a Christmas miracle as beautiful as you.</p>
        <p>You mahh gurllll is the sweet spicy cute hot magic I never knew I needed and the sweetest gift life could have ever given me :)</p>
        <div class="signature">YOUR HANDSOME BF ;)</div>
      `;
    }
  </script>
</body>
</html>
